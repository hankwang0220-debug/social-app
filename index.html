    <nav class="modules">
      <a class="module-card" href="wheel.html">
        <span class="module-icon">🎡</span>
        <span class="module-name">命運轉盤</span>
        <span class="module-desc">吃什麼、喝什麼、做什麼，轉了就知道。還能定位找出附近的店，轉到哪家吃哪家！</span>
        <span class="module-go">開始玩 →</span>

        <span class="module-icon">🍻</span>

        <span class="module-go">開始玩 →</span>
      </a>

      <div class="module-card coming">
        <span class="module-icon">🃏</span>

        <span class="module-go">敬請期待</span>
